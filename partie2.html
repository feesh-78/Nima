<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#c23b6a" />
  <title>Partie 2, rien que nos envies 🔥</title>
  <meta name="description" content="La partie 2 : nos envies, puis une surprise…" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
</head>
<body>
  <!-- Cœurs qui flottent en fond -->
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="app" id="app">

    <!-- ===================== ÉCRAN D'ACCUEIL ===================== -->
    <section class="screen screen--intro is-active" id="screen-intro">
      <div class="card card--intro">
        <div class="intro-emoji">🔥</div>
        <h1 class="intro-title" id="introTitle">La partie 2 t'attend…</h1>
        <p class="intro-sub" id="introSub"></p>

        <button class="btn btn--primary" id="startBtn">
          C'est parti <span class="btn-arrow">→</span>
        </button>
        <p class="intro-note">Encore quelques envies… puis une surprise ✨</p>
      </div>
    </section>

    <!-- ===================== ÉCRAN DES QUESTIONS ===================== -->
    <section class="screen screen--quiz" id="screen-quiz">
      <header class="quiz-header">
        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Étape 1</div>
      </header>

      <div class="card card--question" id="questionCard">
        <!-- Rempli dynamiquement par app.js -->
      </div>

      <div class="quiz-nav">
        <button class="btn btn--ghost" id="backBtn">← Retour</button>
        <button class="btn btn--ghost" id="resetBtn">↺ Recommencer</button>
      </div>
    </section>

    <!-- ===================== ÉCRAN RÉCAPITULATIF ===================== -->
    <section class="screen screen--recap" id="screen-recap">
      <div class="card card--recap">
        <div class="recap-emoji">🎉</div>
        <h2 class="recap-title" id="recapTitle">C'est noté, mon amour !</h2>
        <p class="recap-sub">Voici tout ce que tu as choisi :</p>

        <ul class="recap-list" id="recapList"></ul>

        <div class="recap-actions">
          <button class="btn btn--primary" id="sendBtn">
            💌 Envoyer à mon amoureux
          </button>
          <button class="btn btn--soft" id="copyBtn">📋 Copier le récap</button>
          <button class="btn btn--ghost" id="restartBtn">↺ Recommencer</button>
        </div>

        <p class="recap-note" id="recapNote">
          En cliquant, tes choix lui sont envoyés directement. 💕
        </p>
      </div>
    </section>

  </main>

  <script src="js/quiz-data-2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
